<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogitatio Elegans — The convergence of mind, machine, and epoch</title>
    <meta name="description" content="An evolving repository exploring the deep vectors of human evolution, technological leverage, scientific discovery, and historical mirrors.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cogitatio Elegans">
    <meta property="og:description" content="The convergence of mind, machine, and epoch — essays on human evolution, technological leverage, and historical mirrors.">
    <meta property="og:url" content="https://iggym.github.io/cogitatio-elegans/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cogitatio Elegans">
    <meta name="twitter:description" content="The convergence of mind, machine, and epoch.">
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #131318;
            --border: #22222d;
            --text-main: #f3f3f6;
            --text-muted: #9797a8; /* lightened slightly from #8b8b9e for AA contrast on --bg */
            --accent: #64ffda;
            --accent-glow: rgba(100, 255, 218, 0.15);
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .skip-link {
            position: absolute;
            top: -3rem;
            left: 1rem;
            background: var(--accent);
            color: #0a0a0c;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.6rem 1rem;
            border-radius: 4px;
            z-index: 1000;
            transition: top 0.2s ease;
        }
        .skip-link:focus {
            top: 1rem;
        }

        .pointer-fine .cursor-dot,
        .pointer-fine .cursor-ring {
            display: block;
        }
        .cursor-dot,
        .cursor-ring {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -50%);
        }
        .cursor-dot {
            width: 4px;
            height: 4px;
            background: var(--accent);
        }
        .cursor-ring {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(100, 255, 218, 0.4);
            transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.25s ease,
                        background 0.25s ease;
        }
        .cursor-ring.is-active {
            width: 56px;
            height: 56px;
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 3rem;
        }

        .badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(100, 255, 218, 0.2);
            opacity: 0;
            animation: rise 0.6s ease forwards;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        h1 .word {
            display: inline-block;
            background: linear-gradient(135deg, #ffffff 30%, #8b8b9e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            filter: blur(6px);
            transform: translateY(14px);
            animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 600px;
            margin-bottom: 1.75rem;
            opacity: 0;
            animation: rise 0.7s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes rise {
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        .stats-line {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0;
            margin-bottom: 1.75rem;
            opacity: 0;
            animation: rise 0.7s ease forwards;
            animation-delay: 0.58s;
        }
        .stats-line strong {
            color: var(--text-main);
            font-weight: 600;
        }
        .stats-line .sep {
            margin: 0 0.6rem;
            opacity: 0.5;
        }

        .meta-nav {
            display: flex;
            gap: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            opacity: 0;
            animation: rise 0.7s ease forwards;
            animation-delay: 0.65s;
        }

        .meta-nav a {
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .meta-nav a svg {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .meta-nav a:hover,
        .meta-nav a:focus-visible {
            color: var(--accent);
        }

        .meta-nav a:hover svg {
            transform: rotate(-8deg) scale(1.08);
        }

        .featured-eyebrow {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent);
            margin-bottom: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .featured-eyebrow::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .featured-card {
            background: linear-gradient(160deg, var(--surface), #0d0d11);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 2.25rem;
            text-decoration: none;
            color: inherit;
            display: block;
            margin-bottom: 3.5rem;
            position: relative;
            overflow: hidden;
            border-top: 2px solid var(--cat-color, var(--accent));
            transition: border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }
        .featured-card:hover,
        .featured-card:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
        }
        .featured-card h2 {
            font-size: clamp(1.5rem, 3vw, 2rem);
            letter-spacing: -0.01em;
            margin-bottom: 0.85rem;
        }
        .featured-card p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 640px;
            margin-bottom: 1.25rem;
        }
        .featured-card .article-meta {
            flex-direction: row;
            align-items: center;
            gap: 0.75rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-wrap {
            position: relative;
        }
        .search-wrap svg {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        #search-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }
        #search-input::placeholder {
            color: var(--text-muted);
        }
        #search-input:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .filter-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .filter-pill {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: lowercase;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 0.4rem 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-pill:hover {
            border-color: rgba(100, 255, 218, 0.4);
            color: var(--text-main);
        }
        .filter-pill:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .filter-pill[aria-pressed="true"] {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
        }
        .filter-pill .count {
            opacity: 0.6;
            margin-left: 0.3em;
        }

        .section-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .articles-grid {
            display: grid;
            gap: 1.25rem;
        }

        .article-card {
            --mx: 50%;
            --my: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.75rem;
            text-decoration: none;
            color: inherit;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1.5rem;
            align-items: center;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.12s ease-out;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--cat-color, var(--accent));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .article-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(220px circle at var(--mx) var(--my), var(--accent-glow), transparent 70%);
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        .article-card:hover,
        .article-card:focus-visible {
            border-color: rgba(100, 255, 218, 0.4);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }
        .article-card:hover::before,
        .article-card:focus-visible::before {
            opacity: 1;
        }
        .article-card:hover::after,
        .article-card:focus-visible::after {
            opacity: 1;
        }
        .article-card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .article-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .article-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .article-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .tag {
            display: inline-block;
            background: color-mix(in srgb, var(--cat-color, var(--text-muted)) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--cat-color, var(--text-muted)) 40%, transparent);
            color: var(--cat-color, var(--text-muted));
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            text-transform: lowercase;
        }

        .state-message {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 3rem 0;
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: 8px;
        }

        .state-message .dots::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        .results-count {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        footer {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding: 2rem 0;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 650px) {
            .article-card {
                grid-template-columns: 1fr;
            }
            .article-meta {
                text-align: left;
                flex-direction: row;
                justify-content: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .badge, h1 .word, p.subtitle, .stats-line, .meta-nav,
            .article-card, .featured-card {
                animation: none !important;
                opacity: 1 !important;
                filter: none !important;
                transform: none !important;
            }
            .cursor-dot, .cursor-ring { display: none !important; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to essays</a>
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>
    <canvas id="canvas-bg" aria-hidden="true"></canvas>

    <div class="container">
        <header>
            <div class="badge">Cogitatio Elegans</div>
            <h1 id="hero-heading"></h1>
            <p class="subtitle">An evolving repository exploring the deep vectors of human evolution, technological leverage, scientific discovery, and historical mirrors.</p>
            <p class="stats-line" id="stats-line" aria-live="polite"></p>
            <div class="meta-nav">
                <a href="https://github.com/iggym/cogitatio-elegans" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
                    GitHub Source
                </a>
            </div>
        </header>

        <main id="main-content">
            <div id="featured-container"></div>

            <div class="controls">
                <div class="search-wrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                    <label for="search-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Search essays</label>
                    <input id="search-input" type="text" placeholder="Search essays by title or theme…" autocomplete="off">
                </div>
                <div class="filter-pills" id="filter-pills" role="group" aria-label="Filter by category"></div>
            </div>

            <div class="section-title">
                <span>All Essays</span>
                <span class="results-count" id="results-count" aria-live="polite"></span>
            </div>
            <div id="articles-container" aria-live="polite">
                <div class="state-message"><span class="dots">Indexing thought vectors</span></div>
            </div>
        </main>

        <footer>
            <span id="footer-text">cogitatio-elegans // zero dependencies // raw data</span>
        </footer>
    </div>

    <script>
        (function typeHeading() {
            const heading = document.getElementById('hero-heading');
            const text = 'The convergence of mind, machine, and epoch.';
            const words = text.split(' ');
            heading.innerHTML = words
                .map((w, i) => `<span class="word" style="animation-delay:${0.08 * i}s">${w}</span>`)
                .join(' ');
        })();

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const hasFinePointer = window.matchMedia('(pointer: fine)').matches;
        if (hasFinePointer) document.body.classList.add('pointer-fine');

        const cursorDot = document.querySelector('.cursor-dot');
        const cursorRing = document.querySelector('.cursor-ring');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let ringX = mouseX, ringY = mouseY;

        if (hasFinePointer && !prefersReducedMotion) {
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                cursorDot.style.left = mouseX + 'px';
                cursorDot.style.top = mouseY + 'px';
            });
            (function animateRing() {
                ringX += (mouseX - ringX) * 0.18;
                ringY += (mouseY - ringY) * 0.18;
                cursorRing.style.left = ringX + 'px';
                cursorRing.style.top = ringY + 'px';
                requestAnimationFrame(animateRing);
            })();

            function bindCursorTargets() {
                document.querySelectorAll('a, button, input').forEach((el) => {
                    el.addEventListener('mouseenter', () => cursorRing.classList.add('is-active'));
                    el.addEventListener('mouseleave', () => cursorRing.classList.remove('is-active'));
                });
            }
            bindCursorTargets();
            window.__rebindCursor = bindCursorTargets;
        }

        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let ripples = [];
        let pointer = { x: -9999, y: -9999, active: false };
        let rafId = null;
        let running = true;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.baseRadius = Math.random() * 1.5 + 0.5;
                this.radius = this.baseRadius;
                this.flash = 0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (pointer.active) {
                    const dx = this.x - pointer.x;
                    const dy = this.y - pointer.y;
                    const dist = Math.hypot(dx, dy);
                    const radius = 140;
                    if (dist < radius && dist > 0.01) {
                        const force = (1 - dist / radius) * 0.6;
                        this.x += (dx / dist) * force;
                        this.y += (dy / dist) * force;
                    }
                }

                this.flash *= 0.94;
                this.radius = this.baseRadius + this.flash * 2.2;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 255, 218, ${0.2 + this.flash * 0.6})`;
                ctx.fill();
            }
        }

        function seedParticles() {
            particles = [];
            const count = Math.min(110, Math.floor((width * height) / 18000));
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }
        seedParticles();
        window.addEventListener('resize', seedParticles);

        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.speed = 6;
                this.life = 1;
            }
            update() {
                this.radius += this.speed;
                this.life -= 0.012;
                particles.forEach((p) => {
                    const d = Math.hypot(p.x - this.x, p.y - this.y);
                    if (Math.abs(d - this.radius) < 14) {
                        p.flash = Math.max(p.flash, this.life);
                    }
                });
            }
            draw() {
                if (this.life <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(100, 255, 218, ${this.life * 0.35})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        window.addEventListener('pointermove', (e) => {
            pointer.x = e.clientX;
            pointer.y = e.clientY;
            pointer.active = true;
        });
        window.addEventListener('pointerleave', () => { pointer.active = false; });
        window.addEventListener('pointerdown', (e) => {
            ripples.push(new Ripple(e.clientX, e.clientY));
            if (ripples.length > 6) ripples.shift();
        });

        document.addEventListener('visibilitychange', () => {
            running = !document.hidden;
            if (running && !rafId) animate();
        });

        function animate() {
            if (!running) { rafId = null; return; }
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        const flashBoost = Math.max(particles[i].flash, particles[j].flash);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(100, 255, 218, ${(0.08 + flashBoost * 0.5) * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5 + flashBoost;
                        ctx.stroke();
                    }
                }
            }

            if (pointer.active && !prefersReducedMotion) {
                particles.forEach((p) => {
                    const d = Math.hypot(p.x - pointer.x, p.y - pointer.y);
                    if (d < 130) {
                        ctx.beginPath();
                        ctx.moveTo(pointer.x, pointer.y);
                        ctx.lineTo(p.x, p.y);
                        ctx.strokeStyle = `rgba(100, 255, 218, ${0.12 * (1 - d / 130)})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                });
            }

            particles.forEach((p) => p.draw());
            ripples.forEach((r) => { r.update(); r.draw(); });
            ripples = ripples.filter((r) => r.life > 0);

            rafId = requestAnimationFrame(animate);
        }
        animate();

        function attachTilt(card) {
            if (!hasFinePointer || prefersReducedMotion) return;
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const px = e.clientX - rect.left;
                const py = e.clientY - rect.top;
                const cx = px / rect.width - 0.5;
                const cy = py / rect.height - 0.5;
                card.style.transform = `perspective(600px) rotateX(${(-cy * 6).toFixed(2)}deg) rotateY(${(cx * 6).toFixed(2)}deg) translateY(-2px)`;
                card.style.setProperty('--mx', `${px}px`);
                card.style.setProperty('--my', `${py}px`);
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg) translateY(0)';
            });
        }

        const CATEGORY_COLORS = {
            technology: '#64ffda',
            history: '#e8b76a',
            evolution: '#8fd694',
            intelligence: '#b39ddb',
            singularity: '#f2789f',
            agriculture: '#c9c17a',
            systems: '#7ec8e3',
            science: '#f2a679'
        };
        const FALLBACK_PALETTE = ['#64ffda', '#e8b76a', '#8fd694', '#b39ddb', '#f2789f', '#c9c17a', '#7ec8e3', '#f2a679'];
        function colorForCategory(cat) {
            if (CATEGORY_COLORS[cat]) return CATEGORY_COLORS[cat];
            let hash = 0;
            for (let i = 0; i < cat.length; i++) hash = cat.charCodeAt(i) + ((hash << 5) - hash);
            return FALLBACK_PALETTE[Math.abs(hash) % FALLBACK_PALETTE.length];
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            if (isNaN(d)) return dateStr;
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function cardHref(item) {
            return item.url || `./articles/${item.slug || ''}`;
        }

        function buildCard(item, index, delay) {
            const card = document.createElement('a');
            card.className = 'article-card';
            card.setAttribute('role', 'listitem');
            card.href = cardHref(item);
            card.style.setProperty('--cat-color', colorForCategory(item.category || 'general'));
            card.style.opacity = '0';
            card.style.transform = 'translateY(15px)';
            card.style.transition = `opacity 0.4s ease ${delay}s, transform 0.4s ease ${delay}s`;

            card.innerHTML = `
                <div class="article-content">
                    <h3>${escapeHtml(item.title)}</h3>
                    <p>${escapeHtml(item.description || item.summary || '')}</p>
                </div>
                <div class="article-meta">
                    <span class="tag">${escapeHtml(item.category || 'general')}</span>
                    <time datetime="${escapeHtml(item.date || '')}">${formatDate(item.date)}</time>
                </div>
            `;
            attachTilt(card);
            requestAnimationFrame(() => {
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 30);
            });
            return card;
        }

        function renderFeatured(item) {
            const container = document.getElementById('featured-container');
            if (!item) { container.innerHTML = ''; return; }
            const card = document.createElement('a');
            card.className = 'featured-card';
            card.href = cardHref(item);
            card.style.setProperty('--cat-color', colorForCategory(item.category || 'general'));
            card.innerHTML = `
                <div class="featured-eyebrow">Latest Thought</div>
                <h2>${escapeHtml(item.title)}</h2>
                <p>${escapeHtml(item.description || item.summary || '')}</p>
                <div class="article-meta">
                    <span class="tag">${escapeHtml(item.category || 'general')}</span>
                    <time datetime="${escapeHtml(item.date || '')}">${formatDate(item.date)}</time>
                </div>
            `;
            container.innerHTML = '';
            container.appendChild(card);
        }

        let allArticles = [];
        let activeCategory = 'all';
        let searchQuery = '';

        function applyFilters() {
            const q = searchQuery.trim().toLowerCase();
            return allArticles.filter((item) => {
                const inCategory = activeCategory === 'all' || item.category === activeCategory;
                const haystack = `${item.title} ${item.description || item.summary || ''}`.toLowerCase();
                const matchesQuery = !q || haystack.includes(q);
                return inCategory && matchesQuery;
            });
        }

        function renderGrid() {
            const container = document.getElementById('articles-container');
            const resultsCount = document.getElementById('results-count');
            const filtered = applyFilters();

            resultsCount.textContent = filtered.length === allArticles.length
                ? `${allArticles.length} total`
                : `${filtered.length} of ${allArticles.length}`;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="state-message">No essays match that search — try a different term or clear the filter.</div>';
                return;
            }

            container.innerHTML = '<div class="articles-grid" id="grid" role="list"></div>';
            const grid = document.getElementById('grid');
            filtered.forEach((item, i) => grid.appendChild(buildCard(item, i, Math.min(i * 0.06, 0.6))));
            if (window.__rebindCursor) window.__rebindCursor();
        }

        function renderFilterPills() {
            const wrap = document.getElementById('filter-pills');
            const counts = {};
            allArticles.forEach((a) => { counts[a.category] = (counts[a.category] || 0) + 1; });
            const categories = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

            const pills = [{ key: 'all', label: 'all', count: allArticles.length }]
                .concat(categories.map((c) => ({ key: c, label: c, count: counts[c] })));

            wrap.innerHTML = '';
            pills.forEach((p) => {
                const btn = document.createElement('button');
                btn.className = 'filter-pill';
                btn.type = 'button';
                btn.setAttribute('aria-pressed', String(p.key === activeCategory));
                btn.innerHTML = `${escapeHtml(p.label)}<span class="count">${p.count}</span>`;
                btn.addEventListener('click', () => {
                    activeCategory = p.key;
                    document.querySelectorAll('.filter-pill').forEach((el) => el.setAttribute('aria-pressed', 'false'));
                    btn.setAttribute('aria-pressed', 'true');
                    renderGrid();
                });
                wrap.appendChild(btn);
            });
            if (window.__rebindCursor) window.__rebindCursor();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGrid();
        });

        async function loadArticles() {
            const container = document.getElementById('articles-container');
            try {
                const response = await fetch('./metadata.json');
                if (!response.ok) throw new Error('Metadata fetch failed');
                const articles = await response.json();

                if (!Array.isArray(articles) || articles.length === 0) {
                    container.innerHTML = '<div class="state-message">No articles indexed within metadata schema yet — check back soon.</div>';
                    return;
                }

                allArticles = articles.slice().sort((a, b) => new Date(b.date) - new Date(a.date));

                const categoryCount = new Set(allArticles.map((a) => a.category)).size;
                document.getElementById('stats-line').innerHTML =
                    `<strong>${allArticles.length}</strong> essays<span class="sep">·</span><strong>${categoryCount}</strong> threads<span class="sep">·</span>updated <strong>${formatDate(allArticles[0].date)}</strong>`;
                document.getElementById('footer-text').textContent =
                    `cogitatio-elegans // ${allArticles.length} essays indexed // zero dependencies`;

                renderFeatured(allArticles[0]);
                renderFilterPills();
                renderGrid();
            } catch (err) {
                container.innerHTML = '<div class="state-message">Failed to load metadata.json stream. Ensure the file is present in root.</div>';
            }
        }

        loadArticles();
    </script>
</body>
</html>
